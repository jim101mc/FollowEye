name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build FollowEye.exe
        run: pyinstaller --noconfirm followeye.spec
      - name: Zip
        run: Compress-Archive -Path dist/FollowEye -DestinationPath FollowEye-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FollowEye-windows
          path: FollowEye-windows.zip
